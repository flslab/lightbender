# Model comparison mission. Select the observer with wrench_interaction.force_estimator.
# Restore controller.mission_file to translation_level_coast_contact_validation.yaml afterwards.
name: translation_level_coast_old_model_validation
drones:
  lb11:
    target: [-0.8, -0.5, 1]
    interaction: single
Interaction:
  action: translation
  config:
    behavior: level_coast
    detection_method: vel  # potentiometer | model | vel
    record_potentiometer: false  # Record calibrated compression/force with any detection method.
    vicon_source_metadata: true
    duration: 60
    contact_validation_capture:
      enabled: false
      command_authority: false
      profile_path: Interaction/profiles/contact_validation_lb11_20260930.json
      profile_sha256: 7078ab9d78fa80543a26c17aff89b794113fc61ef89b1082482379f054f1a4b7
      initial_no_touch_s: 10.0
    grace_time: 1
    level_coast:
      command_mode: position  # position | orientation; during interaction.
      coast_command_mode: orientation  # Retain estimator/diagnostic setup; no coast executes when coasting_enabled is false.
      estimator_switch_at: release # detect | release (default); switch to estimator 3 for S-curve.
      coasting_enabled: false  # true: coast as configured; false: hold current XY at release (vel: below release_speed_m_s for release_dwell_s).
      estimator_hover_xy: false  # Reuse saved X/Y compensation; first fit settles 2s + samples 3s; needs eskfXY firmware.
      estimator_hover_xy_mode: auto  # auto (default) | refresh (remeasure) | reuse (saved fit required).
      grace_start: release
      follow_yaw: false
      yaw_rate_damping: false
      roll_diagnostics: false  # Read-only: both estimators and roll attitude/rate PID terms at 50 Hz; false disables.
      stop_speed_m_s: 0.03  # ori: interaction-direction speed; pos: XY speed; scurve: unused.
      velocity:
        onset_speed_m_s: 0.13
        release_speed_m_s: 0.129
        onset_dwell_s: 0.03
        release_dwell_s: 0.05
        max_sample_gap_s: 0.1
    # Potentiometer contact/release thresholds.
    virtual_object:
      contact_detection:
        force_threshold_n: 0.18
        onset_dwell_s: 0.03
      release_behavior:
        force_drop_n: 0.04
        candidate_lead_drop_n: 0.005
        decrease_rate_n_s: 0.05
        unloaded_force_n: 0.17
        unloaded_dwell_s: 0.05
        max_sample_gap_s: 0.15
        candidate_sensor_stale_timeout_s: 0.25
        candidate_stall_timeout_s: 0.15
        force_memory_s: 0.02
    wrench_interaction_profile: level_coast
    wrench_interaction:
      firmware_auto_brake:
        analytic_profile:
          tail_s: 0.3  # S-curve unwind reference duration; applied only when S-curve is selected.
      force_estimator: specific_force  # specific_force: raw IMU; momentum: original model.
      specific_force:
        window_s: 0.08
      impulse_estimator:
        window_s: 0.08  # Pin the legacy window while continuing to load saved XYZ calibration.
boundary_limits:
  x_min: -1.5
  x_max: 1.5
  y_min: -1.5
  y_max: 1.5
  z_min: 0.3
  z_max: 1.5
