# Source log YAML: orchestrator/logs/translation_level_coast_old_model_validation_2026-10-30_12-03-20/translation_level_coast_old_model_validation_translation_level_coast_old_model_validation_2026-10-30_12-03-20.yaml
# Historical base mission with explicit hover bias-calibration overrides.
# Model comparison mission. Select the observer with wrench_interaction.force_estimator.
# Restore controller.mission_file to translation_level_coast_contact_validation.yaml afterwards.
name: vel_PB_PB
drones:
  lb11:
    target: [-0.8, -1.2, 1.0, 0.0]
    interaction: single
Interaction:
  action: translation
  config:
    behavior: level_coast
    detection_method: vel  # potentiometer | model | vel
    record_potentiometer: true  # Record calibrated compression/force with any detection method.
    vicon_source_metadata: true
    duration: 60
    contact_validation_capture:
      enabled: false
      command_authority: false
      profile_path: Interaction/profiles/contact_validation_lb11_20260930.json
      profile_sha256: 7078ab9d78fa80543a26c17aff89b794113fc61ef89b1082482379f054f1a4b7
      initial_no_touch_s: 10.0
    grace_time: 1
    level_coast:
      smooth_hover_transition: true
      command_mode: position  # position | orientation; during interaction.
      coast_command_mode: position  # position | orientation | scurve; after release; omitted inherits command_mode.
      estimator_switch_at: never  # detect | release (default) | never; never keeps estimator 2 throughout.
      estimator_hover_xy: false  # Reuse saved X/Y compensation; first fit settles 2s + samples 3s; needs eskfXY firmware.
      estimator_hover_xy_mode: auto  # auto (default) | refresh (remeasure) | reuse (saved fit required).
      grace_start: release
      follow_yaw: false
      yaw_rate_damping: false
      roll_diagnostics: false  # Read-only: both estimators and roll attitude/rate PID terms at 50 Hz; false disables.
      stop_speed_m_s: 0.03  # ori: interaction-direction speed; pos: XY speed; scurve: unused.
      velocity:
        onset_speed_m_s: 0.13
        release_speed_m_s: 0.08
        onset_dwell_s: 0.03
        release_dwell_s: 0.05
        max_sample_gap_s: 0.1
    # Potentiometer contact/release thresholds.
    virtual_object:
      contact_detection:
        force_threshold_n: 0.18
        onset_dwell_s: 0.03
      release_behavior:
        force_drop_n: 0.04
        candidate_lead_drop_n: 0.005
        decrease_rate_n_s: 0.05
        unloaded_force_n: 0.17
        unloaded_dwell_s: 0.05
        max_sample_gap_s: 0.15
        candidate_sensor_stale_timeout_s: 0.25
        candidate_stall_timeout_s: 0.15
        force_memory_s: 0.02
    wrench_interaction_profile: level_coast
    wrench_interaction:
      # Permit mild hover motion during the per-flight bias calibration.
      calibration_max_speed_m_s: 0.10
      calibration_max_angular_rate_rad_s: 0.35
      bias_calibration_timeout_s: 20.0
      initial_contact_arming:
        enabled: false  # Skip the extra XY stationary dwell before contact readiness.
      firmware_auto_brake:
        # F1 reset policy: true keeps the existing behavior; false disables it.
        reset_on_mode_change: true  # pidCtl.resetMode; control-mode changes.
        reset_xy_on_scurve_transition: true  # hlCommander.pRelRstXY; S-curve entry/hold.
        stop_deceleration_m_s2: 3.6  # Current paper firmware limit: <= 3.6 m/s^2.
      force_estimator: specific_force  # specific_force: raw IMU; momentum: original model.
      specific_force:
        window_s: 0.08
      impulse_estimator:
        window_s: 0.08  # Pin the legacy window while continuing to load saved XYZ calibration.
boundary_limits:
  x_min: -1.5
  x_max: 1.5
  y_min: -1.5
  y_max: 1.5
  z_min: 0.3
  z_max: 1.5
