controller:
  ip: 192.168.1.230
  zmq_cmd_port: 5556
  zmq_ack_port: 5557
  http_port: 8000
  mission_path: "SFL"
  mission_files:
    - hover.yaml
  downloads_file: downloads.json

marker_grid_node:
  id: marker-grid
  ip: 192.168.1.81
  user: fls
  work_dir: /home/fls/fls-marker-localization
  venv_path: /home/fls/env
  port: 5558
  grid_file: high_rate_localizer/config/hypergrid-mygrid-4x4.json
  gpio: 10
  mygrid_level: 40
  hypergrid_level: 200
  # Optional. Omit this field to turn on every tile's HyperGrid.
  # An empty list turns off every HyperGrid tile.
  # hypergrid_tiles:
  #   - [0, 0]
  #   - [0, 1]
  initial_mode: "off"

common:
  work_dir: /home/fls/fls-cf-offboard-controller
  venv_path: /home/fls/env
  localizer_work_dir: /home/fls/fls-marker-localization

drones:
  - id: "lb1"
    ip: lightbendercf01
    user: fls
    init_pos: [ 0.25, -0.25, 0.2 ]
    type: V
    servo_offsets: [0, -1]
    uri: radio://0/100/2M/E7E7E7E701
  - id: "lb2"
    ip: lightbendercf02
    user: fls
    init_pos: [ -0.5, 0.0, 0.2 ]
    type: V
    servo_offsets: [2, -3]
    uri: radio://0/100/2M/E7E7E7E702
  - id: "lb3"
    ip: lightbendercf03
    user: fls
    init_pos: [ 0.25, 0.25, 0.2 ]
    type: V
    servo_offsets: [2, -5]
    uri: radio://0/100/2M/E7E7E7E703
  - id: "lb4"
    ip: lightbendercf04
    user: fls
    init_pos: [ -0.25, -0.25, 0.2 ]
    type: H
    servo_offsets: [0, 0]
    uri: radio://0/100/2M/E7E7E7E704
  - id: "lb5"
    ip: lightbendercf05
    user: fls
    init_pos: [ 0.0, 0.0, 0.2 ]
    type: H
    servo_offsets: [0, 0]
    uri: radio://0/100/2M/E7E7E7E705
  - id: "lb7"
    ip: lightbendercf07
    user: fls
    init_pos: [ 0.0, -0.5, 0.2 ]
    type: H
    servo_offsets: [3, 0]
    uri: radio://0/100/2M/E7E7E7E707
  - id: "lb8"
    ip: lightbendercf08
    user: fls
    init_pos: [-0.5, 0.5, 0]
    type: H
    flowdeck: false
    vicon: false
    save_vicon: true
    tracker: true
    marker_tile: [0, 0]
  - id: "lb9"
    ip: lightbendercf09
    user: fls
    init_pos: [ 0.5, 0.5, 0.2 ]
    type: V
    servo_offsets: [-1, 0]
    uri: radio://0/100/2M/E7E7E7E709
  - id: "lb10"
    ip: lightbendercf10
    user: fls
    init_pos: [ 0.0, -0.5, 0.2 ]
    type: H
    servo_offsets: [3, 3]
    uri: radio://0/100/2M/E7E7E7E710
  

mission:
  delta_t: 0.0
  require_handshake: true

camera_node:
  ip: 192.168.1.90
  user: fls

radio_node:
  ip: 192.168.1.90
  user: fls
